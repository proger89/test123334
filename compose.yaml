name: vsm-hackathon
x-app: &app
  image: vsm-hackathon-api:local
  build:
    context: .
    dockerfile: infra/Dockerfile.api
  env_file: .env
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: vsm
    DB_USERNAME: vsm
    SESSION_DRIVER: database
    SESSION_LIFETIME: 43200
    CACHE_STORE: database
    APP_DEBUG: 'false'
    LOG_CHANNEL: stderr
    CONTENT_PATH: /var/www/content
services:
  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: vsm
      POSTGRES_USER: vsm
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U vsm -d vsm']
      interval: 3s
      retries: 20
  init:
    <<: *app
    command: php artisan vsm:init
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    depends_on:
      init: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'SCRIPT_FILENAME=/var/www/html/public/index.php REQUEST_METHOD=GET REQUEST_URI=/api/health/ready cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q ''"ready":true''']
      interval: 5s
      retries: 10
  worker:
    <<: *app
    command: php artisan vsm:work
    depends_on:
      init: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: [CMD, php, artisan, 'vsm:worker-health']
      interval: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    ports: ['127.0.0.1:8180:80']
    depends_on: [api]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/api/health/ready']
      interval: 5s
      retries: 20
volumes:
  pgdata:

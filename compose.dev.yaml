services:
  web:
    volumes:
      - ./infra/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
      frontend-dev: {condition: service_healthy}
  api:
    volumes:
      - ./server/app:/var/www/html/app:ro
      - ./server/routes:/var/www/html/routes:ro
      - ./content:/var/www/content:ro
  worker:
    volumes:
      - ./server/app:/var/www/html/app:ro
      - ./content:/var/www/content:ro
  frontend-dev:
    image: node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    working_dir: /app
    command: sh -c 'npm ci && npm run dev'
    volumes:
      - ./client:/app
      - node_modules:/app/node_modules
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 30
volumes:
  node_modules:

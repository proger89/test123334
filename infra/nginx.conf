server {
 listen 80;
 root /usr/share/nginx/html;
 location = /index.html { add_header Cache-Control "no-cache" always; }
 location = /build.json { add_header Cache-Control "no-store" always; }
 location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
 location / { add_header Cache-Control "no-cache" always; try_files $uri /index.html; }
 location /api/ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; fastcgi_pass api:9000; }
}

# This configuration belongs to the Aeza demonstration at 185.173.147.205.
server {
  listen 80;
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
    try_files $uri =404;
  }
  location / { return 308 https://185.173.147.205$request_uri; }
}

server {
  listen 443 ssl;
  server_name 185.173.147.205;
  ssl_certificate /etc/letsencrypt/live/vsm-ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vsm-ip/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:1m;
  ssl_session_timeout 10m;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  location /api/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTPS on;
    fastcgi_pass api:9000;
  }
}

# Container-only readiness check. No public HTTP session or API access.
server {
  listen 127.0.0.1:8080;
  location = /api/health/ready {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_pass api:9000;
  }
  location / { return 404; }
}

# 8443 remains available for links from the initial HTTPS rollout.
services:
  web:
    ports: !override ['0.0.0.0:80:80', '0.0.0.0:443:443', '0.0.0.0:8443:443']
    volumes:
      - ./infra/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./runtime/acme:/var/www/acme:ro
      - ./runtime/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/api/health/ready']
